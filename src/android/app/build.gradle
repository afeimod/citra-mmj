apply plugin: 'com.android.application'

android {
    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    defaultConfig {
        applicationId "org.citra.emu"
        // minSdk 必须是 28（与旧仓库 CI 成功构建一致）：
        // AGP externalNativeBuild 默认用 minSdkVersion 作为 native 编译平台
        // (ANDROID_PLATFORM)。minSdk 24 时按 android-24 (__ANDROID_API__=24) 编译，
        // cubeb 的 AAudio 后端 (cubeb_aaudio.cpp) 里所有 AAudio API（Android 26
        // 引入）会报 "error: 'AAudio_createStreamBuilder' is unavailable:
        // introduced in Android 26"，构建直接失败。
        // 旧仓库 minSdk 28 + 同款 NDK 29 构建成功 → 恢复 28。
        minSdkVersion 28
        targetSdkVersion 31
        versionCode(getBuildVersionCode())
        versionName "${getVersion()}"
    }

    // 签名配置：用户自己用 MT 管理器签名，构建不依赖本机密钥路径。
    // release 构建出 unsigned APK，用户下载后用 MT Manager / apksigner 自己签。
    // 如果要自动签名，把 src/android/keystore.properties 文件放进来即可
    // （keyAlias / keyPassword / storeFile / storePassword 四个字段），下面会自动启用。
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            // 仅当 keystore.properties 文件存在时才配置签名；否则 release 出 unsigned APK
            if (keystoreProperties.getProperty('storeFile') != null) {
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
            }
            // 没有 keystore.properties 时啥也不设，让 release 走 unsigned 路径
        }
    }

    // Define build types, which are orthogonal to product flavors.
    buildTypes {
        // 有 keystore.properties 则自动签名；否则出 unsigned APK（MT 管理器/apksigner 自签）
        release {
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // Signed by debug key disallowing distribution on Play Store.
        // Attaches 'debug' suffix to version and package name, allowing installation alongside the release build.
        debug {
            // TODO If this is ever modified, change application_id in debug/strings.xml
            applicationIdSuffix ".debug"
            versionNameSuffix '-debug'
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
            version '3.31.6'
        }
    }

    ndkVersion = '29.0.14206865'
    lint {
        abortOnError false
    }
    namespace 'org.citra.emu'

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DENABLE_QT=0", // Don't use QT
                        "-DENABLE_SDL2=0", // Don't use SDL
                        "-DENABLE_WEB_SERVICE=0", // Don't use web services
                        "-DANDROID_ARM_NEON=true", // cryptopp requires Neon to work
                        "-DENABLE_CUBEB=1",
                        "-DANDROID_STL=c++_static",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DCMAKE_CXX_FLAGS_RELEASE=-Ofast",
                        "-DCMAKE_CXX_FLAGS=-Wno-invalid-specialization"
                abiFilters "arm64-v8a"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.core:core-google-shortcuts:1.0.1"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

def getVersion() {
    def versionNumber = '0.0'

    try {
        versionNumber = 'git describe --always --long'.execute([], project.rootDir).text
                .trim()
                .replaceAll(/(-0)?-[^-]+$/, "")
    } catch (Exception e) {
        logger.error('Cannot find git, defaulting to dummy version number')
    }

    return versionNumber
}


def getBuildVersionCode() {
    try {
        def versionNumber = 'git rev-list --first-parent --count HEAD'.execute([], project.rootDir).text
                .trim()
        return Integer.valueOf(versionNumber)
    } catch (Exception e) {
        logger.error('Cannot find git, defaulting to dummy version number')
    }

    return 0
}
