name: Android Build

on:
  # 只保留手动触发（Actions 页面点 Run workflow），不开 push 自动构建
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release / debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # 必须拉完整历史：versionCode = git rev-list --first-parent --count HEAD，
          # versionName = git describe --always --long（app/build.gradle），
          # 浅克隆会退化成 versionCode=1。
          # 注意不要开 submodules: recursive —— .gitmodules 里 ext-boost /
          # ext-soundtouch / ext-libressl-portable / dynarmic-android 四个
          # citra-emu 仓库已 404，会拉失败。改用 fetch-deps.sh 从替代地址
          # 把依赖作为普通目录 vendor 进来。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Git (skip system config)
        run: |
          # 容器里 /etc/gitconfig 不可读，跳过它
          git config --system --add safe.directory '*' || true
          echo "GIT_CONFIG_NOSYSTEM=1" >> "$GITHUB_ENV"

      - name: Install NDK 29 and CMake 3.31.6
        run: |
          # app/build.gradle 写死 ndkVersion '29.0.14206865' / cmake '3.31.6'，
          # runner 预装的 NDK 版本对不上，必须显式装（AGP 不会自己挑对版本）。
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null
          echo '--- NDK installed ---'
          ls "$ANDROID_HOME/ndk" || true
          echo '--- CMake installed ---'
          ls "$ANDROID_HOME/cmake" || true

      - name: Fetch external dependencies
        run: |
          # fetch-deps.sh 负责：boost 1.83.0 tarball、16 个外部依赖从可用
          # 镜像/替代仓库浅克隆、fmt 钉 8.1.1、dynarmic 用 afeimod 的
          # android fork、dynarmic 的 oaknut 头文件。
          bash fetch-deps.sh

          # 钉死 teakra 到 2022 年初的版本（避免上游 API 漂移）
          git -C externals/teakra fetch -q --unshallow || true
          git -C externals/teakra checkout -q \
            "$(git -C externals/teakra rev-list -n1 --before=2022-01-01 origin/HEAD)"
          echo "teakra pinned at $(git -C externals/teakra rev-parse --short HEAD)"

          # 初始化 cubeb / enet / dynarmic / teakra 自己的嵌套 submodule
          for d in externals/cubeb externals/enet externals/dynarmic externals/teakra; do
            [ -d "$d/.git" ] && git -C "$d" submodule update --init --recursive --depth 1 || true
          done

          # boost tarball 由 fetch-deps.sh 完成，这里只做健康检查
          test -f externals/boost/boost/version.hpp

      - name: Patch build files
        run: |
          set -e
          # --- cryptopp 命名：master 用 crc_simd.cpp（下划线），本仓库的
          #     externals/cryptopp/CMakeLists.txt 期望 crc-simd.cpp（连字符）。
          #     检测后做 sed 替换。---
          cd externals/cryptopp
          if ls cryptopp/*_simd.cpp >/dev/null 2>&1 && ! ls cryptopp/*-simd.cpp >/dev/null 2>&1; then
            echo ">>> Detected underscore naming, patching cryptopp CMakeLists.txt"
            sed -i 's/-simd\.cpp/_simd.cpp/g' CMakeLists.txt
          fi
          grep -i 'crc' CMakeLists.txt | head -5 || true
          cd ../..

          # --- fmt / dynarmic 冲突：把 fmt 提到最前，禁掉 dynarmic 自带的 fmt ---
          sed -i '/^# libfmt/d; /^add_subdirectory(fmt)/d; /^add_library(fmt::fmt ALIAS fmt)/d' \
              externals/CMakeLists.txt
          sed -i '1i add_subdirectory(fmt)' externals/CMakeLists.txt
          echo "# disabled in CI" > externals/dynarmic/externals/fmt/CMakeLists.txt

          # --- 移除 dynarmic 的 install/export 规则（与 Android NDK 工具链冲突）---
          sed -i '/^install(EXPORT dynarmicTargets/,/^)/d' externals/dynarmic/CMakeLists.txt || true
          sed -i 's/^install(TARGETS dynarmic EXPORT dynarmicTargets)/##&/' \
              externals/dynarmic/CMakeLists.txt || true

          # --- SoundTouch include path：若上游用 INTERFACE 写法，切换成 PUBLIC
          #     （INTERFACE 会让 SoundTouch 自己的源文件拿不到 -I.../include，
          #     导致 STTypes.h 找不到）。---
          if grep -q '^target_include_directories(SoundTouch INTERFACE' \
              externals/soundtouch/CMakeLists.txt 2>/dev/null; then
            echo ">>> Detected INTERFACE include path in soundtouch, switching to PUBLIC"
            sed -i 's/^target_include_directories(SoundTouch INTERFACE/target_include_directories(SoundTouch PUBLIC/' \
                externals/soundtouch/CMakeLists.txt
          fi

          # --- cubeb JNI 重复符号修复 ---
          # cubeb 的 cubeb-jni-instances.h 默认 inline 定义了 cubeb_get_jni_env_for_thread()
          # 和 cubeb_jni_get_context_instance() 返回 nullptr；但本仓库 src/android/jni/jni_common.cpp
          # 也定义了同名函数返回真实的 JNIEnv / Context。链接时 ld.lld 报 duplicate symbol。
          # 把 header 改成只声明不定义，让 jni_common.cpp 提供实际实现。
          printf '%s\n' \
            '#ifndef _CUBEB_JNI_INSTANCES_H_' \
            '#define _CUBEB_JNI_INSTANCES_H_' \
            '' \
            '#include <jni.h>' \
            '' \
            '// Declarations only - actual definitions are provided by citra-mmj JNI layer' \
            '// (src/android/jni/jni_common.cpp) so cubeb_stream_get_position() can use the' \
            '// real Android JVM context instead of cubeb default nullptr.' \
            'JNIEnv* cubeb_get_jni_env_for_thread();' \
            'jobject cubeb_jni_get_context_instance();' \
            '' \
            '#endif //_CUBEB_JNI_INSTANCES_H_' \
            > externals/cubeb/src/cubeb-jni-instances.h

          # --- 健康检查：列出最终要被编译的 simd 文件，确保都存在 ---
          echo '--- final simd files in CMakeLists ---'
          grep '_simd\.cpp\|-simd\.cpp' externals/cryptopp/CMakeLists.txt || true
          ls externals/cryptopp/cryptopp/*simd* 2>/dev/null || true

      - name: Ensure oaknut headers exist for dynarmic
        run: |
          # fetch-deps.sh 已拉过，这里做幂等兜底
          OAK=externals/dynarmic/externals/oaknut
          if [ ! -f "$OAK/include/oaknut/code_block.hpp" ]; then
            echo ">>> oaknut missing, cloning fresh"
            rm -rf "$OAK"
            git clone --depth 1 https://github.com/merryhime/oaknut.git "$OAK"
          fi
          ls "$OAK/include/oaknut/" | head
          echo "CPATH=$(pwd)/$OAK/include" >> "$GITHUB_ENV"

      - name: Read Gradle version
        id: gradle_ver
        run: |
          V=$(grep distributionUrl src/android/gradle/wrapper/gradle-wrapper.properties \
              | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "GRADLE_VERSION=$V" >> "$GITHUB_ENV"
          echo "Detected Gradle $V"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Build APK (${{ github.event.inputs.build_type }})
        working-directory: src/android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          # src/common/CMakeLists.txt 用 $ENV{CI} 做官方 CI 品牌识别，
          # GitHub Actions 默认 CI=true 会进入 citra-emu 识别分支，
          # 因仓库名不匹配导致 string(REGEX MATCH) 参数不足而崩溃；
          # 置 0 让 CMake 跳过该分支（旧仓库构建同款设置）
          CI: "0"
        run: |
          set -o pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            gradle assembleDebug --no-daemon 2>&1 | tee ../../build.log
          else
            gradle assembleRelease --no-daemon 2>&1 | tee ../../build.log
          fi

      - name: Collect APK artifacts (unsigned, ready for MT Manager)
        if: success()
        run: |
          mkdir -p artifacts
          # release 构建无 keystore.properties 时出 unsigned APK，
          # 下载后用 MT 管理器/apksigner 自签即可安装
          find src/android -name "*.apk" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: citra-mmj-az-apk
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
