name: Android Build

on:
  # 只保留手动触发，去掉 push / pull_request 自动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release / debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不要使用 submodules: recursive —— .gitmodules 里 4 个 citra-emu 仓库
          # 已被删除，会拉失败。改用 fetch-deps.sh 把依赖作为普通目录 vendor 进来。

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Git (skip system config)
        run: |
          # 容器里 /etc/gitconfig 不可读，跳过它
          git config --system --add safe.directory '*' || true
          echo "GIT_CONFIG_NOSYSTEM=1" >> "$GITHUB_ENV"

      - name: Fetch external dependencies
        run: |
          bash fetch-deps.sh

          # 钉死 teakra 到 2022 年初的版本（避免上游 API 漂移）
          git -C externals/teakra fetch -q --unshallow || true
          git -C externals/teakra checkout -q \
            "$(git -C externals/teakra rev-list -n1 --before=2022-01-01 origin/HEAD)"
          echo "teakra pinned at $(git -C externals/teakra rev-parse --short HEAD)"

          # 初始化 cubeb / enet / dynarmic / teakra 自己的嵌套 submodule
          for d in externals/cubeb externals/enet externals/dynarmic externals/teakra; do
            [ -d "$d/.git" ] && git -C "$d" submodule update --init --recursive --depth 1 || true
          done

          # 用 1.83.0 的 boost tarball 替换 submodule（boostorg/boost 自身的
          # submodule 在 CI 上太慢，单包头文件足够 Citra 编译）
          rm -rf externals/boost
          curl -fL https://archives.boost.org/release/1.83.0/source/boost_1_83_0.tar.gz | tar xz
          mv boost_1_83_0 externals/boost
          test -f externals/boost/boost/version.hpp

      - name: Switch cryptopp to master + list crc files
        run: |
          # fetch-deps.sh 把 cryptopp 拉下来后停在默认分支 master，但本仓库的
          # externals/cryptopp/CMakeLists.txt 期望的 crc-simd.cpp 是 8.2.0 的旧命名，
          # master 已经改成 crc_simd.cpp（下划线）。下面这步把 cryptopp 钉到
          # 最新 master HEAD 并验证，下一步用 sed 把 CMakeLists 的 -simd 改成 _simd。
          cd externals/cryptopp/cryptopp
          git fetch --depth 1 origin master
          git checkout -q origin/master
          echo "cryptopp now at: $(git rev-parse --short HEAD)"
          echo '--- crc-related files in cryptopp master ---'
          ls | grep -i crc || true

      - name: Patch build files
        run: |
          set -e
          # --- cryptopp 命名：master 用 crc_simd.cpp（下划线），CMakeLists 期望
          #     crc-simd.cpp（连字符）。检测后做 sed 替换。---
          cd externals/cryptopp
          if ls cryptopp/*_simd.cpp >/dev/null 2>&1 && ! ls cryptopp/*-simd.cpp >/dev/null 2>&1; then
            echo ">>> Detected underscore naming, patching cryptopp CMakeLists.txt"
            sed -i 's/-simd\.cpp/_simd.cpp/g' CMakeLists.txt
          fi
          echo '--- cryptopp CMakeLists crc refs after patch ---'
          grep -i 'crc' CMakeLists.txt | head -5 || true
          cd ../..

          # --- fmt / dynarmic 冲突：把 fmt 提到最前，禁掉 dynarmic 自带的 fmt ---
          sed -i '/^# libfmt/d; /^add_subdirectory(fmt)/d; /^add_library(fmt::fmt ALIAS fmt)/d' \
              externals/CMakeLists.txt
          sed -i '1i add_subdirectory(fmt)' externals/CMakeLists.txt
          echo "# disabled in CI" > externals/dynarmic/externals/fmt/CMakeLists.txt

          # --- 移除 dynarmic 的 install/export 规则（与 Android NDK 工具链冲突）---
          sed -i '/^install(EXPORT dynarmicTargets/,/^)/d' externals/dynarmic/CMakeLists.txt || true
          sed -i 's/^install(TARGETS dynarmic EXPORT dynarmicTargets)/##&/' \
              externals/dynarmic/CMakeLists.txt || true

          # --- SoundTouch include path：新版 azahar-emu/soundtouch 的 CMakeLists
          #     已经正确地用 PUBLIC 设置了 include path，不需要打 patch。
          #     如果上游又改回旧的 INTERFACE 写法，这里只做一个幂等加固，把
          #     INTERFACE 替换成 PUBLIC（INTERFACE 只对消费者生效，会让 SoundTouch
          #     自己的源文件编译时拿不到 -I.../include，导致 STTypes.h 找不到）。---
          if grep -q '^target_include_directories(SoundTouch INTERFACE' \
              externals/soundtouch/CMakeLists.txt 2>/dev/null; then
            echo ">>> Detected INTERFACE include path in soundtouch, switching to PUBLIC"
            sed -i 's/^target_include_directories(SoundTouch INTERFACE/target_include_directories(SoundTouch PUBLIC/' \
                externals/soundtouch/CMakeLists.txt
          fi
          echo '--- soundtouch include_directories line ---'
          grep -n 'target_include_directories(SoundTouch' \
              externals/soundtouch/CMakeLists.txt || true

          # --- 健康检查：列出最终要被编译的 simd 文件，确保都存在 ---
          echo '--- final simd files in CMakeLists ---'
          grep '_simd\.cpp\|-simd\.cpp' externals/cryptopp/CMakeLists.txt || true
          echo '--- actual files matching _simd or -simd in cryptopp source ---'
          ls externals/cryptopp/cryptopp/*simd* 2>/dev/null || true

      - name: Ensure oaknut headers exist for dynarmic
        run: |
          OAK=externals/dynarmic/externals/oaknut
          if [ ! -f "$OAK/include/oaknut/code_block.hpp" ]; then
            echo ">>> oaknut missing, cloning fresh"
            rm -rf "$OAK"
            git clone --depth 1 https://github.com/merryhime/oaknut.git "$OAK"
          fi
          ls "$OAK/include/oaknut/" | head
          echo "CPATH=$(pwd)/$OAK/include" >> "$GITHUB_ENV"

      - name: Read Gradle version
        id: gradle_ver
        run: |
          V=$(grep distributionUrl src/android/gradle/wrapper/gradle-wrapper.properties \
              | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "GRADLE_VERSION=$V" >> "$GITHUB_ENV"
          echo "Detected Gradle $V"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build APK (${{ github.event.inputs.build_type }})
        working-directory: src/android
        env:
          CI: "0"
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -o pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            gradle assembleDebug --no-daemon 2>&1 | tee ../../build.log
          else
            gradle assembleRelease --no-daemon 2>&1 | tee ../../build.log
          fi

      - name: Sign release APK (throwaway CI key)
        if: success() && github.event.inputs.build_type == 'release'
        run: |
          keytool -genkeypair -keystore ci.jks -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=CI"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          mkdir -p out
          find src/android -path "*release*" -name "*.apk" | while read -r f; do
            "$APKSIGNER" sign --ks ci.jks --ks-pass pass:android \
              --out "out/$(basename "${f%.apk}")-signed.apk" "$f"
          done
          ls -la out

      - name: Collect APK artifacts
        if: success()
        run: |
          mkdir -p artifacts
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            cp -v out/*.apk artifacts/ 2>/dev/null || true
          fi
          # 不管 release / debug，都把构建产物里的 apk 一并复制过来
          find src/android -name "*.apk" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: citra-mmj-apk
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
